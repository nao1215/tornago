name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit_test:
    name: Integration test with coverage (linux)

    strategy:
      matrix:
        platform: [ubuntu-latest]

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          check-latest: true

      - name: Install Tor
        run: |
          sudo apt-get update
          sudo apt-get install -y tor

      # Every Tor-dependent test skips itself when the daemon on the runner cannot
      # reach the network - a bootstrap that stalls partway, a control cookie that
      # never appears - and what is left is the deterministic tests alone, which
      # cover around 69% against an 80% gate. That number is the Tor network's
      # answer rather than a coverage regression, so the report is published only
      # when the integration tests actually ran. A run that skipped them says so in
      # the job summary and leaves the badge on its last real measurement.
      - name: Run integration tests with coverage
        id: integration
        run: |
          set -o pipefail
          make integration-test | tee integration.log
          if grep -q "skipping integration test because" integration.log; then
            echo "tor_reachable=false" >> "$GITHUB_OUTPUT"
          else
            echo "tor_reachable=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          TORNAGO_INTEGRATION: "1"

      - name: Note that the coverage gate was not measured
        if: steps.integration.outputs.tor_reachable == 'false'
        run: |
          {
            echo "### Coverage not measured"
            echo
            echo "Tor could not reach the network on this runner, so every"
            echo "integration test skipped itself and the coverage profile covers"
            echo "only the deterministic tests. The gate is not applied to it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Copy coverage file for octocov
        if: steps.integration.outputs.tor_reachable == 'true'
        run: cp coverage-integration.out coverage.out

      - uses: k1LoW/octocov-action@v1.5.2
        if: steps.integration.outputs.tor_reachable == 'true'
