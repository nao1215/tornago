name: Property

# The property, metamorphic and differential tests draw their inputs with
# testing/quick. The ordinary `go test` run draws a hundred per test, which
# keeps a pull request fast but leaves most of the space unvisited. This job
# draws far more every night, with a new random seed each time, so the tests
# keep searching somewhere new without slowing anyone's merge.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 19 * * *"

permissions:
  contents: read

jobs:
  property:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      # A failing property prints the input that broke it; rerun that test
      # locally with the input as a table case.
      - name: Draw 20,000 inputs per property
        run: go test . -short -run '^Test(Property|Metamorphic|Differential)_' -quickchecks=20000 -timeout 25m
