name: MultiPlatformUnitTest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit_test:
    name: Unit test with Tor

    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
          - "windows-latest"
        # The floor go.mod declares and the newest release. The floor is 1.24
        # because the tests use testing.T.Context, which 1.23 does not have;
        # nothing in the tree needs anything newer, and this matrix is the only
        # place that claim is checked. "stable" tracks each Go release without
        # an edit, and is used rather than "1" because setup-go resolves "1"
        # from its own manifest, which lags a fresh release.
        go:
          - "1.24"
          - "stable"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Install Tor (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y tor

      - name: Install Tor (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install tor

      - name: Install Tor (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $torDir = "C:\ProgramData\chocolatey\lib\tor\tools\Tor"
          $torBinary = Join-Path $torDir "tor.exe"
          $maxAttempts = 3

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            choco install tor -y --no-progress
            if ($LASTEXITCODE -eq 0 -and (Test-Path $torBinary)) {
              break
            }

            if ($attempt -eq $maxAttempts) {
              throw "Failed to install Tor after $maxAttempts attempts"
            }

            Start-Sleep -Seconds (15 * $attempt)
          }

          Add-Content -Path $env:GITHUB_PATH -Value $torDir
          & $torBinary --version

      - name: Run integration tests with coverage
        run: make integration-test
        env:
          TORNAGO_INTEGRATION: "1"
