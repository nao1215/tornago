name: MultiPlatformUnitTest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit_test:
    name: Unit test with Tor

    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
          - "windows-latest"
        go:
          - "1.25"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Install Tor (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y tor

      - name: Install Tor (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install tor

      - name: Install Tor (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $torDir = "C:\ProgramData\chocolatey\lib\tor\tools\Tor"
          $torBinary = Join-Path $torDir "tor.exe"
          $maxAttempts = 3

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            choco install tor -y --no-progress
            if ($LASTEXITCODE -eq 0 -and (Test-Path $torBinary)) {
              break
            }

            if ($attempt -eq $maxAttempts) {
              throw "Failed to install Tor after $maxAttempts attempts"
            }

            Start-Sleep -Seconds (15 * $attempt)
          }

          Add-Content -Path $env:GITHUB_PATH -Value $torDir
          & $torBinary --version

      - name: Run integration tests with coverage
        run: make integration-test
        env:
          TORNAGO_INTEGRATION: "1"
