name: OpenBSD Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    name: OpenBSD unit test
    strategy:
      matrix:
        os:
          - name: openbsd
            architecture: x86-64
            version: "7.8"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test on ${{ matrix.os.name }}
        uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: ${{ matrix.os.name }}
          architecture: ${{ matrix.os.architecture }}
          version: ${{ matrix.os.version }}
          shell: bash
          memory: 8G
          cpu_count: 4
          run: |
            sudo pkg_add go tor gmake git
            git config --global --add safe.directory /home/runner/work/tornago/tornago
            go version
            tor --version
            go mod download
            gmake integration-test
        env:
          TORNAGO_INTEGRATION: "1"
